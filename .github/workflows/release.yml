name: 测试与发布

# 每次推送都会先在云端测试识别效果（启动软件、上传模拟发票、检查结果）。
# 推送到 main 且测试通过后，打包 Windows 版本；
# package.json 里的 version 是新版本号时，自动发布到 Releases，已安装的客户端会自动更新。
on:
  push:
    branches: ['**', '!ci-results']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 测试用邮箱服务器（模拟 QQ 邮箱收发票）
    services:
      greenmail:
        image: greenmail/standalone:2.0.1
        ports: ['3025:3025', '3143:3143']
        env:
          GREENMAIL_OPTS: '-Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 准备识别组件
        shell: bash
        run: mkdir -p test-output && npm run vendor 2>&1 | tee test-output/vendor.log

      - name: 识别单元测试
        shell: bash
        run: npm test 2>&1 | tee test-output/unit.log

      - name: 安装界面测试需要的系统组件
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libnss3 libgbm1 libgtk-3-0 libxss1 libasound2t64 fonts-noto-cjk >/dev/null || sudo apt-get install -y -qq xvfb libnss3 libgbm1 libgtk-3-0 libxss1 libasound2 fonts-noto-cjk >/dev/null

      - name: 启动软件上传发票测试
        shell: bash
        env:
          MAIL_TEST: '1'
          MAIL_SMTP_PORT: '3025'
          MAIL_IMAP_PORT: '3143'
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run test:e2e 2>&1 | tee test-output/e2e.log

      - name: 保存测试截图和报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output/
          retention-days: 7

      # 测试日志和截图同时放到 ci-results 分支，方便查看
      - name: 上传测试结果到 ci-results 分支
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/res && cp -r test-output/. /tmp/res/ 2>/dev/null || true
          echo "${GITHUB_REF_NAME} ${GITHUB_SHA}" > /tmp/res/RUN.txt
          cd /tmp/res && git init -q && git checkout -q -b ci-results
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "测试结果 ${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

  build-windows:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 读取版本号
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$V 已经发布过，这次只打包不发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "将发布新版本 v$V"
          fi

      - name: 打包并发布新版本
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      - name: 只打包（版本号没变）
        if: steps.ver.outputs.exists == 'true'
        run: npm run dist -- --publish never

      - name: 保存安装包（7 天）
        uses: actions/upload-artifact@v4
        with:
          name: invoice-audit-${{ steps.ver.outputs.version }}
          path: dist/*.exe
          retention-days: 7
